[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "georvq"
version = "0.1.0"
description = "Pyramidal residual-VQ compression for geospatial datasets: variable-rate matryoshka codecs with learned entropy models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
# The base install is the decode path: georvq.inference, the release
# layers (georvq.ae, georvq.tessera), georvq.factory/model/sources.
# tests/test_install_boundary.py checks that it imports and runs without
# the [train] packages.
dependencies = [
    # 2.10 is the oldest release on which the suite passes: the AE v2
    # golden gate (tests/test_ae_v2_bundle.py) sees different codes and
    # decoded bits on 2.6-2.9, and uint16 pool indexing is missing there
    "torch>=2.10",
    # numpy 1.26 also changes the AE v2 golden codes
    "numpy>=2.0",
    "pyarrow",
    "pydantic>=2.5",
    "pyyaml",
    "rasterio>=1.4",   # AE release layer: tile encode, GeoTIFF output
    # a store's proj:wkt2 attribute and Tessera v2's UTM georeferencing;
    # without it an encoder wrote stores missing proj:wkt2
    "pyproj>=3.0",
    "huggingface_hub",   # release bundles named by a store's header
    # coded stores; 3.3 is the first release that reads the inner chunks
    # of a shard concurrently, and it needs Python 3.12
    "zarr>=3.3",
    "fsspec",
    "aiohttp",           # fsspec over http(s)
]

[project.optional-dependencies]
# training, stores, evaluation and figures
train = ["pandas", "matplotlib", "scikit-learn", "wandb"]
tessera = ["geotessera"]   # fetch Tessera tiles for a chip store build
# the tessera-vq baseline (scripts/baseline_tessera_vq.py; Yang, Feng & Keshav)
baseline = ["tessera-vq @ git+https://github.com/sk818/tessera-vq.git@v0.3.1"]
# Downstream eval benchmarks (AEF extraction, ASTER GED, LUCAS/LCMAP)
eval = ["georvq[train]", "h5py", "requests", "pyproj", "shapely"]
# Rate-sweep GIF rendering
viz = ["georvq[train]", "imageio", "pillow"]
# ONNX export (the dynamo exporter imports onnxscript) and onnxruntime
# decode (backend="onnx"); onnxruntime 1.19 is the first built for numpy 2
onnx = ["onnx", "onnxruntime>=1.19", "onnxscript"]
# ERA5 reader and the ERA5 / CMIP6 / NextGEMS store builders
era5 = ["xarray", "gcsfs", "healpy"]
# the demo notebooks and their generators
notebooks = ["georvq[train]", "jupyter", "nbformat", "duckdb", "geopandas"]
# the suite covers training; xarray un-skips the store's xarray test
dev = ["georvq[train]", "pytest", "xarray"]

[project.scripts]
georvq-train = "georvq.cli:train_pyramid"
georvq-train-stage1 = "georvq.cli:train_stage1"
georvq = "georvq.cli:main"

[tool.setuptools.packages.find]
include = ["georvq*"]

[tool.setuptools.package-data]
georvq = ["sources/*.json"]

[tool.pytest.ini_options]
markers = [
    "slow: tests over about 10 s on CPU",
]
testpaths = ["tests"]
