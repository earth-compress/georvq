# Sentinel-2 L1C: 13 bands at three native resolutions, read LIVE from the
# Major-TOM Core-S2L1C GeoTIFFs. No chip store is built and no pixels are
# copied -- Major-TOM is already a chip store on a regular 10 km grid, and
# resharding its 1.2 TB would gain nothing. The only thing cached is a
# scene catalogue (paths + grid position) under ~/.cache/georvq.
#
#   georvq-train -c configs/s2_pyr96.yaml --gpu 0
#
# CLOUDS ARE KEPT. cloud_mask.tif sits beside the bands and is deliberately
# not applied: cloud is part of the distribution the codec has to carry.
#
# UNVALIDATED. Unlike every other preset here this one reproduces no run --
# no S2 model has been trained. The geometry is derived from
# docs/SOURCE_ONBOARDING.md (the S2 column), not copied from a preset, and
# the derivation is written out so the first run can argue with it.

data:
  source: s2
  store_dir: /data/Major-TOM/Core-S2L1C
  reader: live_s2        # pinned, so startup never depends on autodetection
  val_frac: 0.02
  pool:
    # Measured on this corpus: 64 ms and 12.1 MB per scene (13 bands,
    # 15.6 scenes/s/thread). 10,240 resident scenes is ~124 GB of host RAM
    # (box has 503 GB). Pool size buys INSTANTANEOUS DIVERSITY -- how many
    # distinct scenes one batch can draw from -- while refresh_per_s sets
    # how often each is replaced. At 1024 a batch of 1024 windows was
    # hitting the same scenes repeatedly.
    size: 10240
    workers: 8
    # Whole scenes: the rasters are LZW with 1024 px blocks over a 1068 px
    # image, so a partial read decompresses the band anyway -- taking half
    # the rows would double the read cost per resident pixel, not halve it.
    slot_rows: 1068
    # Reuse per scene is windows/s / refresh_per_s, INDEPENDENT of pool
    # size: at ~630 win/s and 32 scenes/s each scene is drawn ~20 times
    # before eviction, and the corpus sweeps in ~55 min.
    #
    # workers/refresh are capped by the GIL, not by disk. 24 workers at 64
    # scenes/s measured 243 win/s with GPU utilisation oscillating 29-99%
    # (disk was 27% busy, so not the constraint): the reader threads
    # contend with the training thread for the interpreter. 8 workers ran
    # at 653 win/s. More readers is not more data.
    refresh_per_s: 32.0
    device: cpu
    cycle: true            # sweep the corpus; never resample a resident subset
    align_crops: true

model:
  # W=96, not the habitual 64: the fine-token patch (window / finest grid)
  # must divide by 6 for all three native grids to decode exactly, and 96
  # is the smallest such window that keeps a 1/4/16 pyramid. It also makes
  # the fine cell 6 px = one 60 m pixel exactly. S2 autocorrelation only
  # falls below 0.5 at 32 px, so a 96 px window is not over-large.
  window: 96
  bands: 13
  # dims 32/64/64 and K 64/512/4096 are the SOURCE_ONBOARDING table's row
  # for S2 (d95 of 3/3/3 says the latents are generously sized already).
  tiers: ["1:32:64:8", "4:64:512:8", "16:64:4096:8"]
  # Fitted basis for the 26 per-band mean/std floats the normalizer
  # removes: 9.73 B/window measured (77.8 bits, 0.0084 b/px) against 416
  # bits raw. The method is ported from the ring-space beta releases,
  # which measured ~11 B/tile on the same 26-value layout; the basis
  # itself is refitted on OUR windows.
  stats_pca: artifacts/s2_stats_pca.npz
  min_depths: [6, 1, 0]
  full_frac: 0.005
  ff_ratio: 2.0
  tokenizer: {dim: 256, depth: 9}
  decoder: {dim: 384, depth: 12, heads: 8, head_feat: 64, cls_bridge: true}
  vq:
    commit_weight: 0.25
    dead_threshold: 0.000625
    ema_decay: 0.99
    bf16_scores: true
    skip_masked: true
    warmup_steps: 500     # VQ-free warmup, then residual k-means codebook init
    warmup_truncate: true
    kmeans_sample: 32768

train:
  # 80k at batch 1024 = the released Tessera recipe, which is the closest
  # validated precedent for this architecture. Measured here: throughput
  # SATURATES at ~630 windows/s from batch 768 up (384 -> 445, 768 -> 628,
  # 1536 -> 634, 2048 -> 570), so above 768 a larger batch buys codebook
  # sampling and gradient quality, not speed. 1024 peaks at 25.6 GiB of
  # 80, and gives the coarse tier 1024 x 1 x 100 / 64 = 1600 vectors per
  # codeword, well clear of the ~450 crossover.
  steps: 80000
  batch_windows: 1024
  # Early training is easy: more parameter updates beat better gradients.
  # Quarter batch for the first 5k steps. lr is NOT rescaled -- ~2x the
  # gradient noise, benign this early.
  batch_ramp: {until: 5000, divisor: 4}
  amp: true
  grad_ckpt: true
  tf32: true
  # lr 1.5e-4 at batch 1024 is the released Tessera setting for this
  # geometry. The ring-space S2 run used 5e-4 at batch 2048 (with a 1e-4
  # polish for its last 2k steps), so this sits between the two under
  # sqrt-scaling rather than being inherited from either.
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000}
  val_interval: 1000
  fig_interval: 2000
  save_interval: 2500

log:
  run_tag: s2_pyr96
  wandb: true
  wandb_project: georvq

eval:
  # A NESTED ladder for the reconstruction panels. The default canonical
  # points are four independently-named samples, not a chain: `half`
  # clamps its coarse component up to min_depths[0]=6 while `coarse_only`
  # uses the full 8, so tier-0 depth reads 6, 8, 6, 8 down the figure and
  # the rows look like a refinement they are not.
  #
  # This ladder is monotone in every component AND follows the efficient
  # front FINDINGS describes -- saturate coarse, then mid, then add fine
  # levels one at a time, because cells dominate rate (one tier-2 level
  # costs 3,072 bits against tier-1's 144 and tier-0's 6).
  recon_tuples: ["8-1-0", "8-8-0", "8-8-1", "8-8-2", "8-8-4", "8-8-8"]
