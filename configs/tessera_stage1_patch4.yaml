# Representational noise-floor probe: single-vector autoencoder on 4x4
# patches. 16 px x 128 bands = 2048 values -> ONE 1024-d latent (2x
# compression at int8) -> back out. Per-pixel input tokens + CLS readout
# (single-tier tokenizer mode), generously sized trunk so capacity is
# not the binding constraint. Measures what the technique can do at
# near-pixel scale with no large-scale task complexity — how much of the
# w64 residual is representational vs task-driven.
inherit: tessera_pyr64.yaml

model:
  window: 4
  vq: null
  sigma: {max: 4.0, freqs: 8}
  tiers: ["1:1024:2048:8"]
  min_depths: [8]
  tokenizer: {dim: 512, depth: 8}
  decoder: {dim: 512, depth: 8, heads: 8, head_feat: 128, cls_bridge: false}

train:
  steps: 40000
  batch_windows: 4096
  compile: true
  grad_ckpt: false
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000, lr0_steps: 100}
  val_interval: 500
  fig_interval: 5000
  save_interval: 5000

eval:
  recon_tuples: ["8"]

log:
  run_tag: tessera_s1_patch4
