# Standard 64px 3-tier AlphaEarth pyramid (the flagship recipe).
data:
  source: ae
  store_dir: /data/AE-samples/chips_1024
  val_frac: 0.04
  pool:
    size: 38300
    workers: 6
    slot_rows: 96
    refresh_per_s: 100.0
    device: cpu

model:
  window: 64
  bands: 64
  tiers: ["1:256:2048:8", "4:192:8192:8", "16:64:16384:8"]
  min_depths: [6, 1, 0]
  full_frac: 0.005
  ff_ratio: 2.0
  tokenizer: {dim: 256, depth: 9}
  decoder: {dim: 384, depth: 12, heads: 8, head_feat: 64, cls_bridge: true}
  vq:
    commit_weight: 0.25
    dead_threshold: 0.000625
    ema_decay: 0.99
    bf16_scores: true
    skip_masked: true

train:
  steps: 200000
  batch_windows: 512
  amp: true
  grad_ckpt: true
  tf32: true
  optim: {lr: 5.0e-5, wd: 0.01, warmup: 5000}
  val_interval: 1000
  fig_interval: 2000
  save_interval: 2500
  val_tuples: 16

eval:
  recon_tuples: ["8-1-0", "8-8-0", "8-8-2", "8-8-8"]

log:
  run_tag: pyr64
  wandb_project: georvq
