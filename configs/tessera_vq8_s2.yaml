# Stage-2 for Tessera, AE-style: warm-start from the finished stage-1
# ceiling run (tessera_s1_4x, cos 0.9801 / rel 0.189), FREEZE the encoder
# for the whole run, fit int8-QAT codebooks by residual k-means on the
# frozen latents after a short decoder-only warmup, then train decoder +
# books. The sigma-conditioned cond_mlp has a different input width than
# the depth thermometer, so load_partial leaves it fresh by design;
# everything else (stem/tokenizer/decoder/head) warm-starts.
inherit: tessera_vq8.yaml

train:
  steps: 60000
  init_from: /home/ali/projects/ring-space/checkpoints/tessera_s1_4x/model.pt
  freeze_encoder_steps: 60000
  optim: {lr: 2.5e-4, wd: 0.01, warmup: 500}

log:
  run_tag: tessera_vq8_s2
