# 0.99-ceiling probe: 3-tier pyramid on 32px windows with beefed latents.
# Cells 32/8/2 px (grids 1/4/16, 273 tokens); 384 dims on every tier =
# 102.4 dims/px = 1.25x naive int8 — sized from the corrected noise-floor
# curve (0.99 context-free needs ~96 dims/px, and context adds little in
# the low-compression regime). Dense full-attention trunk (no suffix, no
# masks: accuracy first). Batch 2048 w32-windows = pixel parity with the
# w64 runs at 512. 80k steps.
inherit: tessera_pyr64.yaml

model:
  window: 32
  vq: null
  sigma: {max: 4.0, freqs: 8}
  tiers: ["1:384:2048:8", "4:384:8192:8", "16:384:16384:8"]
  min_depths: [6, 1, 0]
  tokenizer: {dim: 512, depth: 12}
  decoder: {dim: 576, depth: 12, heads: 8, head_feat: 128, cls_bridge: true}

train:
  steps: 80000
  batch_windows: 2048
  compile: true
  grad_ckpt: true
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000, lr0_steps: 100}
  val_interval: 500
  fig_interval: 5000
  save_interval: 5000

log:
  run_tag: tessera_s1_w32hd
