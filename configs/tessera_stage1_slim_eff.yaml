# Slim + efficient: the eff trunk (narrow neighborhood-cross suffix)
# at the 2x run's widths, exploiting 2x ~= 4x at the ceiling (0.9800 vs
# 0.9801 — fine width beyond 128 was surplus at this cell size). Fine
# tier latent 128, suffix stream 128 (4x less FC in the dominant line),
# base tokenizer at 384. Also halves the fine tier's int8-latent payload
# (18.1 -> 9.6 B/px) and its codebook download. Caveat this run tests:
# in the narrow-suffix design the stream width IS the processing width,
# a slightly stronger constraint than "128 latent" was on a shared-width
# trunk.
inherit: tessera_pyr64.yaml

model:
  vq: null
  sigma: {max: 4.0, freqs: 8}
  tiers: ["1:384:2048:8", "4:384:8192:8", "16:128:16384:8"]  # coarse 384: honest width (tok trunk is 384; a 512 label would be rank-capped payload waste)
  local_attn: [null, null, 2]
  tokenizer: {dim: 384, depth: 14, late_join: 7, suffix_dim: 128}
  decoder: {dim: 576, depth: 12, heads: 8, head_feat: 128, cls_bridge: true,
            late_join: 6, suffix_dim: 128, head_dw: true}

train:
  steps: 40000
  batch_windows: 512
  compile: true
  grad_ckpt: false
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000, lr0_steps: 100}
  val_interval: 500
  fig_interval: 5000
  save_interval: 5000

log:
  run_tag: tessera_s1_slim_eff
