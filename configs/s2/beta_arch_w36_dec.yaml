# A decoder-only stage on beta_arch_w36 at step 42,500, to test whether
# training the decoder on frozen codes closes the gap between the
# unquantised ceiling and the top rung. Scored in DN, top rung over
# ceiling RMSE is 1.40 for this checkpoint against 1.16 for beta_v4,
# whose decoder was trained in a separate stage on the quantised latents
# of a frozen encoder and frozen books. georvq trained everything jointly
# with moving books.
#
#   sbatch scratch/s2-final/jobs/beta_arch_w36_dec.sbatch
#
# train.decoder_only holds the encoder (with its BatchNorm statistics)
# and the books in eval mode with no gradient, so there are no EMA
# updates, resets or k-means init, and the commitment loss is dropped.
# The optimiser is a fresh AdamW over the decoder alone (22.5M
# parameters). The weights come through train.init_from from a copy of
# the step-42,500 checkpoint; vq.warmup_steps is 0 so that the loaded
# books are never refitted.
#
# Depth sampling close to beta's decoder stage: the coarse tier always at
# 8 levels and the fine tier uniform over 0..8. Nested sampling with
# min_depths [8, 0] and full_frac 0 gives that: the coarse depth is drawn
# from [8, 8] and the fine depth uniformly from [0, 8]. beta's stage
# trained 1..8 only; 8-0 is kept here so the coarse-only rung stays
# usable (a first attempt at 1..8 was stopped at step 2,000 for that
# reason).
#
# The first 500 steps run at lr 0 (optim.lr0_steps) so that the fresh
# AdamW's moment estimates fill before any weight moves.
#
# lr 2e-4 and AdamW weight decay 0.01, as beta's decoder stage. A
# 1000-step warmup, because a fresh AdamW's zero second moments give
# full-size first updates, then cosine to zero over the 15,000 steps.
# beta held its lr constant for 80,000 steps; with a fixed and shorter
# budget, annealing gives the end of the run its lowest-noise updates,
# and the 15,000-step snapshot is the one reported.
#
# Batch 16384 windows. At the base run's 7168 the decoder-only run peaked
# at 27.2 GB of the 80 GB card (wandb, first attempt), since the frozen
# encoder and books carry no gradients or EMA state; 16384 is expected at
# about 57 GB. 15,000 steps keep the data seen close to the planned 30,000
# at 7168 (246M against 215M windows).
#
# Grad clip 0.25, as every recent S2 run, which spiked late under 1.0.
#
# No batch ramp: the base run's only served the unquantised warmup.
# 15,000 steps of 16384 is 246M windows, against beta's 80,000 steps of
# about 2048 tiles (164M).
#
# The collapse guard is off: it watches the unquantised ceiling, which a
# decoder trained only on quantised latents is expected to lose, so a
# fall there is not a sign of collapse in this run.
inherit: beta_arch_w36.yaml

model:
  depth_sampling: nested
  min_depths: [8, 0]
  full_frac: 0.0
  vq:
    warmup_steps: 0
    clip_norm: 0.25

train:
  decoder_only: true
  init_from: /home/ali/projects/georvq-s2-final/checkpoints/beta_arch_w36/frozen_42500.pt
  steps: 15000
  batch_windows: 16384
  batch_ramp: null
  guard_drop: null
  optim: {lr: 2.0e-4, wd: 0.01, warmup: 1000, lr0_steps: 500,
          schedule: cosine}
  save_interval: 2500

log:
  run_tag: beta_arch_w36_dec

eval:
  recon_tuples: ["8-0", "8-1", "8-2", "8-4", "8-8"]
