# Sentinel-2 L1C, two tiers on a 36 px window, laid out after the
# ring-space beta_v4 codec. 13 bands at their native 10 / 20 / 60 m grids,
# read live from Major-TOM Core-S2L1C (clouds kept).
#
#   sbatch --gpus=1 --cpus-per-task=16 --mem=150G --time=6-00:00:00 \
#          --signal=B:USR1@300 job.sbatch
#   where job.sbatch sets PYTHONPATH to the checkout and ends with
#   exec python scripts/train_pyramid.py -c configs/s2/s2_w36.yaml --gpu 0
#   Resume a stopped run with train.resume=checkpoints/s2_w36/model.pt.
#
# Layout chosen by the maintainer: two tiers, as in beta_v4, which no
# deeper pyramid has beaten in his experiments. The window is 36 px so that
# it is a multiple of 6 (the 60 m pixel) and a 10980 px L1C tile divides
# into it exactly (305 x 305 windows, no padding). The fine cell is 6 px,
# the cell size of beta_v4's 7 x 7 HQ grid, and the coarse cell is the
# whole window, as beta's CLS vector is the whole tile.
#
# K from the codebook sample budget (lab/findings/codebook-sample-budget.md),
# vectors per code = batch x cells x EMA window x share / K >= ~450, at
# batch 4096 and EMA decay 0.998 (window 500, as the AE v2 release).
# min_depths [8, 0] sends the coarse tier in full at every rung, as beta
# does with CLS, so every row reaches every coarse level and the path has
# 9 points: the deepest fine level is reached by 0.27 of rows.
#   coarse  1 cell:   K=2048  -> 1000 per code
#   fine   36 cells:  K=16384 -> 1206 per code
# These equal beta_v4's books (14 bits and 8 levels on the fine tier,
# 0.389 b/px per level), so the comparison with beta isolates the window,
# the training recipe and the model size. The batch is capped by memory,
# not by the budget: the EMA update in vq.py builds a dense N x K one-hot
# per level, which needed a 16.3 GiB allocation at batch 8192 with K=16384,
# and a pilot at 8192 ran out of memory on its first quantised step.
#
# Schedule, set by the maintainer: the first 20,000 steps train the
# encoder and decoder unquantised at a quarter of the batch (1024
# windows), then the codebooks are seeded by tree init from the mature
# latents and quantised training runs at the full batch. The ramp ends at
# step 19,999 because the books are fitted at step 20,001 with the batch
# of the step before, and the fit sizes its initial EMA counts from that
# batch. warmup_truncate keeps a random prefix of tiers on each row during
# the warmup, so half the rows are decoded from the coarse tier alone and
# it cannot atrophy over the long unquantised phase.
#
# Latent width 128 on both tiers, as beta_v4. At ~4 bits per latent
# dimension (lab/findings/bits-per-dim-saturation.md) full depth needs at
# least 22 (coarse, 88 bits) and 28 (fine, 112 bits).
#
# Model, a moderate step up from beta_v4: ViT encoder dim 384, depth 9;
# attention decoder dim 512, depth 8, over 37 tokens (33.0M against beta's
# 22.5M transformer decoder); 62.9M parameters in all, 18.9M of them
# codebooks.
#
# Codebook seeding by the balanced PCA tree and dead-code revival by
# splitting the worst-fitting live cell, as in the AE v2 and Tessera
# releases.
#
# Stats channel: the 26 per-band means and stds of each window, over valid
# pixels, as float16 at every rung: 424 bits, 0.327 b/px at this window
# size, accepted by the maintainer. stats_pca is left unset because the
# PCA packing left a 44 DN error floor on B10 when scored per band. The
# ladder runs from 0.40 b/px (coarse only) through 0.78 (one fine level)
# to 3.51 b/px (8-8).

data:
  source: s2
  store_dir: /data/Major-TOM/Core-S2L1C
  reader: live_s2
  val_frac: 0.02
  pool:
    # 8192 whole scenes, 97 GiB resident; the job needs about 150 GB.
    size: 8192
    workers: 8
    slot_rows: 1068
    refresh_per_s: 32.0
    device: cpu
    cycle: true
    align_crops: true

model:
  window: 36
  bands: 13
  tiers: ["1:128:2048:8", "6:128:16384:8"]
  min_depths: [8, 0]
  depth_sampling: path
  full_frac: 0.15
  ff_ratio: 2.0
  tokenizer: {dim: 384, depth: 9}
  decoder: {dim: 512, depth: 8, heads: 8, head_feat: 64, cls_bridge: true}
  vq:
    commit_weight: 0.25
    dead_threshold: 0.000625
    ema_decay: 0.998
    bf16_scores: true
    skip_masked: true
    warmup_steps: 20000
    warmup_truncate: true
    init_mode: tree
    init_per_code: 500
    reset_mode: split

train:
  # About 5.8 days on one A100, measured in the pilot: 3,550 windows/s
  # (0.29 s per step) in the warmup and 3,050 windows/s (1.34 s per step)
  # quantised, so 330,000 quantised steps after the 20,000-step warmup.
  steps: 350000
  batch_windows: 4096
  batch_ramp: {until: 19999, divisor: 4}
  amp: true
  grad_ckpt: true
  tf32: true
  optim: {lr: 3.0e-4, wd: 0.01, warmup: 2000}
  val_interval: 1000
  fig_interval: 5000
  save_interval: 2500

log:
  run_tag: s2_w36
  wandb: true
  wandb_project: georvq

eval:
  recon_tuples: ["8-0", "8-1", "8-2", "8-4", "8-8"]
