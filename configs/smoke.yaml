# Tiny synthetic-store smoke config (CI / laptop).
data:
  source: ae
  store_dir: /tmp/georvq-smoke-store
  val_frac: 0.25
  pool: {size: 8, workers: 1, device: cpu}

model:
  window: 16
  bands: 8
  tiers: ["1:16:32:3", "4:8:32:3"]
  ff_ratio: 2.0
  tokenizer: {dim: 32, depth: 1}
  decoder: {dim: 32, depth: 1, heads: 4, head_feat: 8}
  vq: {dead_threshold: 0.01}

train:
  steps: 30
  batch_windows: 8
  amp: false
  tf32: false
  optim: {lr: 1.0e-3, warmup: 5}
  val_interval: 10
  fig_interval: 1000000
  save_interval: 30

log:
  run_tag: smoke
  wandb: false
