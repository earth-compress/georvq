# Same rate, 16x smaller codebook: K=256 x 14 levels instead of
# K=2048/8192/16384 x 8.
#
# 30,576 bits/window (7.46 b/px) against the baseline's 30,424 (7.43),
# so +0.5% rate -- but the codebook falls from 72 MiB to 4.4 MiB at int8.
#
# Three independent measurements point here:
#
#  * R-D FRONTIER. On the single-pixel sweep, at fixed rate, smaller K with
#    more levels wins: at 192 bits K=2^8 x 24 scored 0.9702 against
#    K=2^10 x 19 at 0.9674; at 384 bits K=2^8 x 48 beat K=2^10 x 38. Every
#    high-rate frontier point preferred shallow books and more of them.
#  * SAMPLE BUDGET. K=16384 at 8 levels is unmaintainable online: the
#    deepest levels get 18-32 vectors per codeword inside the EMA window,
#    far below the ~450 crossover where a fit starts beating no fit, and
#    they lose 90% of their codebook (perplexity 1,658 of 16,384 measured
#    on the trained checkpoint). K=256 gets thousands per code at the same
#    rate, so the pathology cannot arise rather than being repaired.
#  * DOWNLOAD. 4.4 MiB, or ~2.2 MiB at int4.
#
# Equal depths across tiers are REQUIRED, not cosmetic:
# sample_monotone_depths enforces L0 >= L1 >= L2, so a shallower coarse
# tier would make the finer tiers' deep levels unreachable. An earlier
# draft (11/13/14) had tier-2 levels 12-14 at P(active)=0.000.
inherit: tessera_vq8.yaml

data:
  pool:
    size: 19150          # 114 GiB

model:
  tiers: ["1:512:256:14", "4:512:256:14", "16:256:256:14"]
  # Path sampling: every codebook trains equally often. Nested sampling
  # gave tier-2 level 14 P(active)=0.006; path gives 0.197 (32x). The
  # path starts at (4,0,0) -- 32 bits for a 64x64 patch of 128-d vectors
  # is already an absurd operating point and 1-0-0 is not worth training.
  depth_sampling: path
  min_depths: [4, 0, 0]
  full_frac: 0.15        # 15% of rows at full depth
  vq:
    commit_weight: 0.25
    dead_threshold: 0.000625
    # W* ~ sqrt(K), so 64x smaller K wants a ~8x shorter window. It also
    # matters far less now: every level sits above the sample crossover,
    # so the variance term the decay controls is small either way.
    ema_decay: 0.98
    bf16_scores: true
    skip_masked: true
    warmup_steps: 500    # VQ-free warmup, then the init below
    kmeans_sample: 32768
    init_mode: tree      # 92.9% vs 40.0% of K at deep levels
    init_per_code: 2000  # per-tier budget; K=256 makes this cheap
    reset_mode: split    # LBG centroid split, not outlier placement
    book_bits: 8
    passthrough_frac: 0.15   # 15% unquantized: keeps the continuous path alive

train:
  steps: 60000
  batch_windows: 1024
  # encoder + decoder transfer; the rvqs are a different shape so
  # load_partial skips them and they are tree-initialised fresh
  init_from: checkpoints/tessera_vq8_split2/model_best.pt
  optim: {lr: 5.0e-5, wd: 0.01, warmup: 2000, lr0_steps: 100}
  save_interval: 2500

log:
  run_tag: tessera_vq8_k256
