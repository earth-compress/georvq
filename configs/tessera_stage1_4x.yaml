# Tessera stage-1 ceiling, capacity rebalanced around the real choke point.
# Tier latents are read out by a single Linear from one trunk token
# (tokenizer.py `out`) and consumed via Linear(sp.dim, dec_dim), so the
# effective per-cell channel is min(tok_dim, tier_dim, dec_dim) — in the 2x
# run the coarse/mid tiers were silently capped at tok_dim=384. Fix: widen
# and deepen the TOKENIZER (384/12 -> 512/14), set tier dims to what the
# trunk can actually fill (512/512/256), and pay with decoder depth
# (16 -> 12 blocks). 109.1M params vs 107.6M in tessera_stage1_2x.
inherit: tessera_pyr64.yaml

model:
  vq: null
  sigma: {max: 4.0, freqs: 8}
  tiers: ["1:512:2048:8", "4:512:8192:8", "16:256:16384:8"]
  tokenizer: {dim: 512, depth: 14}
  decoder: {dim: 576, depth: 12, heads: 8, head_feat: 128, cls_bridge: true}

train:
  steps: 40000
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000, lr0_steps: 100}
  val_interval: 500
  fig_interval: 5000
  save_interval: 5000

log:
  run_tag: tessera_s1_4x
