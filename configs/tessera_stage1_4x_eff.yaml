# Efficiency-validation run: SAME recipe as tessera_stage1_4x (3-tier,
# w64, tiers 512/512/256, 40k steps, batch 512, final ceiling 0.9801)
# but with the efficient trunk: base tiers (coarse+mid, 17 tokens) run
# the full self-attention stack alone; the fine tier (256 of 273 tokens)
# runs `late_join` NARROW (suffix_dim) neighborhood-cross-attention
# layers — each fine query attends to [17 base | 5x5 local] = 42 gathered
# keys, computed on exactly those pairs (georvq/model/suffix.py), no
# masked dense matrix. ~3x fewer trunk FLOPs; this run measures the
# quality cost vs 0.9801.
inherit: tessera_pyr64.yaml

model:
  vq: null
  sigma: {max: 4.0, freqs: 8}
  tiers: ["1:512:2048:8", "4:512:8192:8", "16:256:16384:8"]
  local_attn: [null, null, 2]
  tokenizer: {dim: 512, depth: 14, late_join: 7, suffix_dim: 256}
  decoder: {dim: 576, depth: 12, heads: 8, head_feat: 128, cls_bridge: true,
            late_join: 6, suffix_dim: 256}

train:
  steps: 40000
  batch_windows: 512
  compile: true
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000, lr0_steps: 100}
  val_interval: 500
  fig_interval: 5000
  save_interval: 5000

log:
  run_tag: tessera_s1_4x_eff
