# Stage-2 for the w32hd encoder: DECODER-ONLY training against frozen
# corpus-fitted codebooks.
#
# Everything upstream of the decoder is fixed. The encoder is frozen for
# the whole run (freeze_encoder_steps == steps), and the codebooks are
# hard-frozen (vq.freeze_books: no EMA, no dead-code resets, no gradient)
# because they were fitted once at corpus scale by
# analysis/fit_corpus_books.py -- letting EMA drift them would desync the
# shipped books from the fitted ones for no measured gain (a fresh 8-iter
# k-means already beat the 60k-step EMA books end-to-end, 0.9766 vs
# 0.9744; ema_decay 0.99 actively DEGRADES deep levels over a long run).
#
# So this run only has to answer one question: how much of the 0.0284 gap
# between the unfinetuned decoder (0.9615) and the stage-1 ceiling
# (0.9899) the decoder can recover once it is trained on quantized
# latents instead of sigma-noised ones.
#
# Matryoshka depth sampling is load-bearing, not a nicety: the stage-1
# decoder was conditioned on a per-tier sigma and has never seen a tier
# that is absent outright, which is why 8-8-0 scores only 0.69 today.
# `decoder.cond_mlp` therefore starts FRESH by design (the sigma Fourier
# features and the depth thermometer have different input widths, so
# load_partial skips it) -- that fresh conditioning path is a large part
# of what the run is training.
inherit: tessera_pyr64.yaml

model:
  window: 32
  sigma: null                      # depth-conditioned now, not sigma
  # LOAD-BEARING. The store, the codebook fit and all of stage-1 use
  # encode_stage1 (L2-normalized * sqrt(dim)); raw encode_levels output
  # has norms 5.3/6.0/9.7 against sqrt(384)=19.6. Quantizing raw latents
  # with these books leaves residual energy of 1.75/1.32/0.49 -- above
  # 1.0 means worse than sending zeros.
  normalize_latents: true
  tiers: ["1:384:2048:8", "4:384:8192:8", "16:384:16384:8"]
  # Coarse tier stays deep (stage-1's floor), but the two finer tiers may
  # drop out entirely: 8-0-0 and 8-8-0 are the operating points the plain
  # stage-1 decoder has never seen, and 8-8-0 scoring 0.69 today is the
  # single biggest thing this run has to fix.
  min_depths: [6, 0, 0]
  tokenizer: {dim: 512, depth: 12}
  decoder: {dim: 576, depth: 12, heads: 8, head_feat: 128, cls_bridge: true}
  vq:
    commit_weight: 0.0             # encoder is frozen: nothing to commit
    bf16_scores: true
    skip_masked: true
    warmup_steps: 0                # books arrive pre-fitted via init_from
    freeze_books: true

train:
  steps: 80000
  batch_windows: 2048
  compile: true
  grad_ckpt: true
  # books + stage-1 weights, merged by analysis/fit_corpus_books.py
  init_from: /home/ali/projects/ring-space/checkpoints/tessera_w32hd_books.pt
  freeze_encoder_steps: 80000      # never unfreeze
  # Hold the decoder's output end still for the first 10k steps so the
  # early, largest gradients reshape how the decoder consumes quantized
  # latents before they perturb the pixel projection stage-1 got right.
  freeze_head_steps: 10000
  freeze_head_blocks: 3
  # 500 steps at lr=0 (AdamW warms its moments), then 500 linear up to the
  # peak, then cosine to zero over the remainder.
  optim: {lr: 1.0e-4, wd: 0.01, warmup: 500, lr0_steps: 500}
  val_interval: 500
  fig_interval: 5000
  save_interval: 2500

log:
  run_tag: tessera_w32hd_vq8_s2
