# Copernicus DEM GLO-30: the pyr64 recipe on 1-band elevation (30m GSD,
# 64px window = 1.92km). Windows are standardized per-tile in DEMSource.prep
# (masked mean/std, S2-style stats side-channel), so the codec learns relief.
inherit: ../ae/pyr64.yaml

data:
  source: dem
  store_dir: /data/georvq-stores/copdem_356
  val_frac: 0.0     # closed distribution: fit the corpus, validate on it
  pool:
    size: 62500       # >= train chips -> coverage mode (every chip resident)
    slot_rows: 96
    device: cpu

model:
  bands: 1

train:
  steps: 40000

log:
  run_tag: dem64
