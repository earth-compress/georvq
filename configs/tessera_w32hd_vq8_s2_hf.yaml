# A/B against tessera_w32hd_vq8_s2: hold the decoder's OUTPUT end still
# for the first 3k steps (last 3 blocks + norm_out + head frozen) so the
# early, largest gradients only reshape the decoder's internal handling
# of quantized latents rather than immediately perturbing the pixel
# projection that stage-1 already got right. Ali's hypothesis.
inherit: tessera_w32hd_vq8_s2.yaml

train:
  freeze_head_steps: 3000
  freeze_head_blocks: 3

log:
  run_tag: tessera_w32hd_vq8_s2_hf
