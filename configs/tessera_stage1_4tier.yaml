# Stage-1 ceiling with a FOURTH pyramid tier at 2x2 px (32x32 cells).
# The s1_4x residual diagnostic showed 84% of the remaining error above
# 8 cyc/window (structure, not noise — err/sig 0.37-0.66 with error
# tracking edges), i.e. beyond the 16-grid tier's spatial Nyquist. The
# trunk stays MLP-dominated at 1297 tokens, so plain full attention is
# ~4x step time — no local-attention machinery needed at this scale.
# Head rides the new finest tier automatically (p=2, cls_bridge concat
# of 4 ancestors). Warm-start from tessera_s1_4x copies the trunk and
# tier 1-3 stems; tier-4 stem/readout, decoder pos and head are fresh.
inherit: tessera_pyr64.yaml

model:
  vq: null
  sigma: {max: 4.0, freqs: 8}
  tiers: ["1:512:2048:8", "4:512:8192:8", "16:256:16384:8", "32:96:16384:8"]
  min_depths: [6, 1, 0, 0]
  tokenizer: {dim: 512, depth: 14}
  decoder: {dim: 576, depth: 12, heads: 8, head_feat: 128, cls_bridge: true}

train:
  steps: 40000
  init_from: /home/ali/projects/ring-space/checkpoints/tessera_s1_4x/model.pt
  optim: {lr: 1.5e-4, wd: 0.01, warmup: 1000, lr0_steps: 100}
  val_interval: 500
  fig_interval: 5000
  save_interval: 5000

log:
  run_tag: tessera_s1_4tier
