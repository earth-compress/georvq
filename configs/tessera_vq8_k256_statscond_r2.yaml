# Restart of the stats-conditioning run from its own step-5000 checkpoint,
# with a much longer small-batch phase.
#
# WHY. The 4x batch step-up at 5000 denoised the loss curve and did nothing
# else: d(log loss)/dstep went from -1.53e-4 to -8.36e-5 while costing 4x
# the compute per step. Two mechanisms, both Ali's read:
#
#  * AdamW normalises the gradient magnitude away -- the update is
#    lr*m/(sqrt(v)+eps), so its size is set by lr almost regardless of the
#    gradient. A bigger batch therefore shrinks numerator and denominator
#    together and mostly just DENOISES a same-sized step, where under SGD
#    it would buy a cleaner descent direction.
#  * Every weight followed by a LayerNorm is scale-invariant, so what
#    matters is the angular update lr/||w||, and with weight decay ||w||
#    equilibrates such that the effective LR goes as sqrt(lr*wd). This
#    trunk is LayerNorm-heavy and wd=0.01 is applied to ALL parameters (no
#    no-decay group), so raising lr alone is a weak, partly transient
#    lever.
#
# What is NOT normalised away is the NUMBER of updates. At a fixed lr Adam
# moves a roughly batch-independent distance per step, so quarter batch
# buys ~4x the parameter-space distance per unit compute. That only stops
# paying when gradient SNR matters -- late, or once the quantizer is live.
# Hence: stay small until just before the codebooks land.
#
# SCHEDULE (this run's step numbering; it warm-starts, so the counter
# restarts at 0 while the model carries 5000 steps of training):
#      0 - 10,000   batch 256   -> 15,000 small-batch steps in total
# 10,001 - 11,000   batch 1024  -> 1,000 full-batch steps to settle
#         11,001    tree init of the codebooks
# 11,001 - 71,000   batch 1024, quantized, EMA live (60,000 steps, the
#                   same quantized budget k256 received)
#
# lr is deliberately UNCHANGED at 1.5e-4: per the above, it is the weak
# lever, and changing it at the same time as the batch schedule would make
# the result uninterpretable.
inherit: tessera_vq8_k256_statscond.yaml

model:
  vq:
    # tree init at 11,001, after 1k full-batch steps have settled the
    # encoder at the batch size the quantized phase will use
    warmup_steps: 11000

train:
  # warm start from the aborted run's step-5000 checkpoint. Its codebooks
  # were polluted by the recon_figure bug (initialised early, from 8 val
  # windows) -- harmless, because the tree init at 11,001 overwrites them
  # wholesale, and mature_warmstart: false keeps them live meanwhile.
  init_from: /home/ali/.claude/jobs/10ba9216/tmp/statscond_step5000.pt
  steps: 71000
  batch_windows: 1024
  batch_ramp: {until: 10000, divisor: 4}
