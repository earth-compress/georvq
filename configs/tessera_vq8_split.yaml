# tessera_vq8 with ONE change: dead codes are revived by distortion-ranked
# splitting instead of a random draw from the batch.
#
# Deliberately a single-variable A/B against the deployed tessera_vq8 run
# (8-8-8 = 0.9604 at 7.43 b/px), so anything that moves is attributable to
# the reset. Everything else is inherited untouched: w64 geometry, the
# 512/512/256 tier dims, ema_decay 0.99, book_bits 8, warmup_steps 500
# followed by the ordinary random-seeded residual k-means init, batch 512,
# lr 5e-5 with the 5000-step ramp, 60k steps.
#
# NOTE the init is deliberately NOT switched to the balanced tree. The
# tree is the far larger effect (on the w32hd books it held tier-2
# level-7 utilisation at 98.6% of K where random init collapsed to 19.9%),
# and turning both on at once would confound the two. This run answers
# only: does the reset operator alone buy anything?
#
# Resets fire every 2500 steps (the built-in interval) and stop at
# reset_freeze_frac=0.9, i.e. step 54000, leaving 6000 steps for the
# cascade to settle before the final checkpoint.
inherit: tessera_vq8.yaml

data:
  pool:
    # HOST-RAM CONSTRAINT, not a design choice. The default 38300-slot
    # pool is 227.9 GiB, and this run shares a 503 GB box with the w32hd
    # e2e run holding another 227.9 GiB; two full pools plus the two
    # processes do not fit, and this machine has a history of host-OOM
    # kills taking runs down. Halved to 114 GiB. The pool is a resident
    # chip CACHE refreshed from disk at 100 chips/s, so this changes how
    # many chips are held at once, not which chips the run can reach --
    # all 40316 still cycle through. Flagged because it is a deviation
    # from the tessera_vq8 baseline being compared against.
    size: 19150

model:
  vq:
    reset_mode: split
    # Books arrive trained via init_from, so no VQ-free warmup and no
    # re-fit -- this continues tessera_vq8, it does not re-derive it.
    warmup_steps: 0
    # LOAD-BEARING. load_partial matures warm-started books (resets off,
    # decay 0.9995), which would disable reset_mode outright and make this
    # run a plain continuation of tessera_vq8 with no experiment in it.
    mature_warmstart: false

train:
  # Continue from the deployed tessera_vq8 (step 47500, cos_full 0.9621).
  # It arrives with ~half of its deep codebooks already dead -- tier2 L7
  # has 8320 of 16384 below the dead threshold, tier1 L7 4178 of 8192 --
  # so the split reset has real work from the first reset event.
  init_from: /home/ali/projects/ring-space/checkpoints/tessera_vq8/model.pt
  batch_windows: 1024
  # 100 steps at lr=0 so AdamW warms its moments before any gradient step;
  # the inherited 5000-step linear ramp and cosine schedule follow.
  optim: {lr: 5.0e-5, wd: 0.01, warmup: 5000, lr0_steps: 100}

log:
  run_tag: tessera_vq8_split
