# tessera_vq8 continued with PERIODIC OFFLINE REFIT phases instead of
# online EMA + dead-code resets.
#
# Books are fully STATIC during training (freeze_books) and move only in a
# refit phase, every 3000 steps, one step after a validation so no
# validation ever scores a book that was replaced moments earlier.
#
# A phase: pause, push ~100 vectors per codeword through the encoder
# (~200 batches, no decode), then walk the tiers LEVEL BY LEVEL --
# quantize, find underused codes, split the highest-distortion cells,
# settle with a few Lloyd iterations, and only then compute the residual
# handed to the next level. That ordering is the substantive change: the
# old scheme reset all 24 books against one stale snapshot, so each
# level's decision was made on a residual the level above had already
# invalidated in the same instant.
#
# Why this replaces what it replaces, all measured on tessera_vq8_split:
#   * EMA usage decided a code's fate from ~2 assignments/step at K=8192;
#     here it is ~100 samples per codeword.
#   * Revived codes were teleported onto the donor cell's worst-fitting
#     point -- an outlier. The instantaneous residual drop was huge (91%
#     on tier1 L8) and ~100% of it evaporated before the next event, every
#     event, for 23000 steps: resid_before went 86.1 -> 85.1 over 23k
#     steps. Splits are now the classical LBG pair, centroid +/- eps along
#     the donor's principal direction, so both members are viable.
inherit: tessera_vq8.yaml

data:
  pool:
    size: 19150          # 114 GiB; shares the host with the other run

model:
  vq:
    warmup_steps: 0      # books arrive trained via init_from
    mature_warmstart: false
    # Static between phases -- no EMA, no online resets. All book
    # movement is deliberate and happens in a refit phase.
    freeze_books: true
    reset_mode: random   # unused: online resets are off entirely
    refit_interval: 3000
    refit_offset: 1
    refit_per_code: 100
    refit_lloyd_iters: 3
    refit_dead_frac: 0.02     # underused := count < 2% of the mean
    refit_recycle_frac: 0.05  # churn >=5% of K per phase regardless

train:
  init_from: /home/ali/projects/ring-space/checkpoints/tessera_vq8/model.pt
  batch_windows: 1024
  optim: {lr: 5.0e-5, wd: 0.01, warmup: 5000, lr0_steps: 100}

log:
  run_tag: tessera_vq8_refit
